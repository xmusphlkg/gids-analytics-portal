<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GIDS Analytics</title>
  <link rel="icon" href="https://globalinfectiousdisease.com/logo-mark-128.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.2.5/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.2.5/500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.2.5/600.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">
    <aside class="nav">
      <a class="brand" href="https://globalinfectiousdisease.com/">
        <img src="https://globalinfectiousdisease.com/logo-mark-128.png" alt="" width="32" height="32">
        <span><strong>GIDS</strong><small>Analytics</small></span>
      </a>
      <nav id="nav" aria-label="Reports"></nav>
      <a class="site-link" href="https://globalinfectiousdisease.com/" data-i18n="site"></a>
    </aside>
    <div class="workspace">
      <header class="top">
        <div>
          <p class="crumb">GIDS · globalinfectiousdisease.com</p>
          <h1 id="title"></h1>
        </div>
        <div class="tools">
          <span id="updated"></span>
          <button type="button" id="lang"></button>
        </div>
      </header>
      <div id="banner" class="banner" hidden></div>
      <section class="metrics" id="metrics"></section>
      <section class="split" id="panel-geo">
        <div class="card map-card">
          <div class="card-head">
            <h2 data-i18n="map"></h2>
            <span data-i18n="mapHint"></span>
          </div>
          <div class="map-frame">
            <div id="map"></div>
            <p id="map-fallback" class="map-fallback" hidden data-i18n="mapFail"></p>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h2 data-i18n="countries"></h2></div>
          <div id="countries"></div>
        </div>
      </section>
      <section class="split lower" id="panel-detail">
        <div class="card" id="panel-pages">
          <div class="card-head"><h2 data-i18n="pages"></h2></div>
          <div class="table-wrap" id="pages"></div>
        </div>
        <div class="card" id="panel-stream">
          <div class="card-head">
            <h2 data-i18n="stream"></h2>
            <span data-i18n="streamHint"></span>
          </div>
          <div id="bars" class="bars" aria-hidden="true"></div>
          <div class="table-wrap" id="stream"></div>
        </div>
      </section>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
