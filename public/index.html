<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GIDS Analytics</title>
  <link rel="icon" href="https://globalinfectiousdisease.com/logo-mark-128.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.2.5/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.2.5/500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.2.5/600.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/app.css?v=6">
</head>
<body>
  <h1 class="sr">GIDS Analytics</h1>
  <div id="map"></div>
  <p id="map-fallback" class="map-fallback" hidden data-i18n="mapFail"></p>
  <header class="hud-top">
    <a class="brand" href="https://globalinfectiousdisease.com/">
      <img src="https://globalinfectiousdisease.com/logo-mark-128.png" alt="" width="32" height="32">
      <span><strong>GIDS</strong><small>Analytics</small></span>
    </a>
    <div class="live"><i></i><span data-i18n="live"></span></div>
    <span id="wait"></span>
    <div class="tools">
      <span id="updated"></span>
      <button type="button" id="lang"></button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <nav class="hud-left" id="ranges"></nav>
  <aside class="hud-right">
    <article class="panel chart">
      <canvas id="spark-uv" aria-hidden="true"></canvas>
      <div class="panel-copy">
        <span data-i18n="users"></span>
        <div class="figure-wrap">
          <strong class="live-num" id="metric-uv">—</strong>
          <sup id="delta-uv" class="delta" hidden></sup>
        </div>
        <em id="users-note"></em>
      </div>
    </article>
    <article class="panel grow">
      <div class="panel-copy">
        <span data-i18n="countries"></span>
        <p class="scope" id="countries-note" hidden></p>
        <div id="countries"></div>
      </div>
    </article>
    <article class="panel chart">
      <canvas id="spark-pv" aria-hidden="true"></canvas>
      <div class="panel-copy">
        <span data-i18n="visits"></span>
        <div class="figure-wrap">
          <strong class="live-num" id="metric-pv">—</strong>
          <sup id="delta-pv" class="delta" hidden></sup>
        </div>
        <em id="visits-note"></em>
      </div>
    </article>
    <article class="panel grow">
      <div class="panel-copy">
        <span data-i18n="parts"></span>
        <p class="scope" id="parts-note" hidden></p>
        <div id="parts"></div>
      </div>
    </article>
  </aside>
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
  <script src="/app.js?v=6"></script>
</body>
</html>
