<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GIDS Analytics</title>
  <link rel="icon" href="https://globalinfectiousdisease.com/logo-mark-128.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.2.5/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.2.5/500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.2.5/600.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/app.css?v=11">
</head>
<body>
  <h1 class="sr">GIDS Analytics</h1>
  <div id="map"></div>
  <p id="map-fallback" class="map-fallback" hidden data-i18n="mapFail"></p>
  <header class="hud-top">
    <a class="brand" href="https://globalinfectiousdisease.com/">
      <img src="https://globalinfectiousdisease.com/logo-mark-128.png" alt="" width="32" height="32">
      <span><strong>GIDS</strong><small>Analytics</small></span>
    </a>
    <div class="live"><i></i><span data-i18n="live"></span></div>
    <span id="wait"></span>
    <div class="range-wrap">
      <button type="button" id="range-btn" class="range-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="range-pop">
        <small data-i18n="range"></small>
        <strong id="range-label"></strong>
      </button>
      <div id="range-pop" class="pop" role="dialog" aria-modal="false" hidden>
        <div class="pop-presets" id="presets"></div>
        <div class="pop-cal">
          <div class="cal-nav">
            <button type="button" id="cal-prev" aria-label="prev"></button>
            <button type="button" id="cal-next" aria-label="next"></button>
          </div>
          <div class="cal-pair" id="cal-pair"></div>
          <div class="pop-foot">
            <span id="draft-label"></span>
            <button type="button" id="range-cancel"></button>
            <button type="button" id="range-apply"></button>
          </div>
        </div>
      </div>
    </div>
    <div class="tools">
      <span id="updated"></span>
      <button type="button" id="lang"></button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <aside class="hud-right">
    <button type="button" class="panel chart" id="open-metrics">
      <canvas id="spark-uv" aria-hidden="true"></canvas>
      <div class="panel-copy">
        <span data-i18n="users"></span>
        <div class="figure-wrap">
          <strong class="live-num" id="metric-uv">—</strong>
          <sup id="delta-uv" class="delta" hidden></sup>
        </div>
        <em id="users-note"></em>
      </div>
    </button>
    <article class="panel grow">
      <div class="panel-copy">
        <span data-i18n="countries"></span>
        <p class="scope" id="countries-note" hidden></p>
        <div id="countries"></div>
      </div>
    </article>
    <button type="button" class="panel chart" id="open-metrics-pv">
      <canvas id="spark-pv" aria-hidden="true"></canvas>
      <div class="panel-copy">
        <span data-i18n="visits"></span>
        <div class="figure-wrap">
          <strong class="live-num" id="metric-pv">—</strong>
          <sup id="delta-pv" class="delta" hidden></sup>
        </div>
        <em id="visits-note"></em>
      </div>
    </button>
    <article class="panel grow">
      <div class="panel-copy">
        <span data-i18n="parts"></span>
        <p class="scope" id="parts-note" hidden></p>
        <div id="parts"></div>
      </div>
    </article>
  </aside>
  <div id="sheets" hidden>
    <section class="sheet" id="sheet-uv" role="dialog" aria-labelledby="sheet-uv-title">
      <header>
        <h2 id="sheet-uv-title" data-i18n="users"></h2>
        <button type="button" data-close="uv"></button>
      </header>
      <p class="sheet-note" id="sheet-uv-note"></p>
      <canvas id="stack-uv"></canvas>
      <div class="legend" id="legend-uv"></div>
    </section>
    <section class="sheet" id="sheet-pv" role="dialog" aria-labelledby="sheet-pv-title">
      <header>
        <h2 id="sheet-pv-title" data-i18n="visits"></h2>
        <button type="button" data-close="pv"></button>
      </header>
      <p class="sheet-note" id="sheet-pv-note"></p>
      <canvas id="stack-pv"></canvas>
      <div class="legend" id="legend-pv"></div>
    </section>
  </div>
  <div id="stack-tip" class="tip" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
  <script src="/app.js?v=11"></script>
</body>
</html>
