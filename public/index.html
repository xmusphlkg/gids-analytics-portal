<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GIDS Analytics</title>
  <link rel="icon" href="https://globalinfectiousdisease.com/logo-mark-128.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.2.5/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.2.5/500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5.2.5/600.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="page">
    <header class="top">
      <a class="brand" href="https://globalinfectiousdisease.com/">
        <img src="https://globalinfectiousdisease.com/logo-mark-128.png" alt="" width="36" height="36">
        <span><strong>GIDS</strong><small>Analytics</small></span>
      </a>
      <div class="live"><i></i><span data-i18n="live"></span></div>
      <div class="tools">
        <span id="updated"></span>
        <button type="button" id="lang"></button>
      </div>
    </header>
    <div id="banner" class="banner" hidden></div>
    <section class="metrics" id="metrics"></section>
    <p class="note" id="note"></p>
    <section class="card map-card">
      <div class="card-head"><h2 data-i18n="map"></h2><span data-i18n="mapHint"></span></div>
      <div class="map-frame">
        <div id="map"></div>
        <p id="map-fallback" class="map-fallback" hidden data-i18n="mapFail"></p>
      </div>
    </section>
    <section class="split">
      <div class="card">
        <div class="card-head"><h2 data-i18n="countries"></h2></div>
        <div id="countries"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2 data-i18n="pages"></h2></div>
        <div id="pages"></div>
      </div>
    </section>
    <section class="card">
      <div class="card-head"><h2 data-i18n="stream"></h2><span data-i18n="streamHint"></span></div>
      <div id="stream"></div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
  <script src="/app.js"></script>
</body>
</html>
